name: Decision
description: A choice someone has to make, with the options and a date
type: Decision
title: "Decide: "
projects: ["lexbridgetechnologies/2"]
body:
  - type: markdown
    attributes:
      value: "**No client data.** No client names, emails, documents or screenshots of client records, here or in comments."
  - type: markdown
    attributes:
      value: "Title: **Decide: the question?**, e.g. *Decide: one environment per customer, or shared?* Assign it to the person who decides."
  - type: textarea
    id: question
    attributes:
      label: What has to be decided?
      description: "One or two sentences. Trace shows this as the summary."
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: The options
      description: "One per line, each with what it means for us."
    validations:
      required: true
  - type: textarea
    id: recommend
    attributes:
      label: What we recommend
      description: "Which option, and why, in a line. Leave it empty if there is no view yet."
  - type: input
    id: decider
    attributes:
      label: Who decides?
      description: "Their Entra account, e.g. name@lexbridge.ie"
    validations:
      required: true
  - type: input
    id: decide-by
    attributes:
      label: Decide by
      description: "A date, e.g. 2026-12-04. Set the same date as **Due** on the Lexbridge Apps Project, so Trace shows it when it is late."
    validations:
      required: true
  - type: textarea
    id: waits
    attributes:
      label: What waits on it?
      description: "The goals or work that can't go on until it is decided."
  - type: markdown
    attributes:
      value: "Decided: write the decision and why as a comment, then close the issue as completed."
