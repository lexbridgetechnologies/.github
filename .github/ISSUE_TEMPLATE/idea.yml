name: Idea
description: Something worth thinking about - not agreed work yet
type: Idea
body:
  - type: markdown
    attributes:
      value: "Title: **the idea in a few words**, e.g. *Pre-fill company details from the registry*."
  - type: markdown
    attributes:
      value: "An Idea is not agreed work. The product owners decide; if it is wanted it becomes a Feature or Task and joins a goal."
  - type: textarea
    id: idea
    attributes:
      label: The idea, in a sentence or two
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
  - type: input
    id: asked-by
    attributes:
      label: Who asked for it?
