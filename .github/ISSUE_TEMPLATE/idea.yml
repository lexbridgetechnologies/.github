name: Idea
description: Something worth thinking about - not agreed work yet
type: Idea
projects: ["lexbridgetechnologies/2"]
body:
  - type: markdown
    attributes:
      value: "**No client data.** No client names, emails, documents or screenshots of client records, here or in comments."
  - type: markdown
    attributes:
      value: "Title: **the idea in a few words**, e.g. *Pre-fill company details from the registry*."
  - type: markdown
    attributes:
      value: "An Idea is not agreed work. It is decided in our meetings: accepted (it becomes a Feature or Task and joins a goal), parked or archived."
  - type: textarea
    id: idea
    attributes:
      label: The idea, in a sentence or two
      description: "Trace shows this as the summary."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
  - type: input
    id: asked-by
    attributes:
      label: Who asked for it?
