name: Feature
description: Something new the app should do, agreed and planned
type: Feature
projects: ["lexbridgetechnologies/2"]
body:
  - type: markdown
    attributes:
      value: "**No client data.** No client names, emails, documents or screenshots of client records, here or in comments."
  - type: markdown
    attributes:
      value: "Title: **what the app will do or have**, e.g. *Client folder navigator*."
  - type: textarea
    id: what
    attributes:
      label: What should the app do?
      description: "One or two sentences. Trace shows this as the summary."
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: Who is it for?
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: "One check per line. Someone else should be able to tick each one."
    validations:
      required: true
  - type: input
    id: requirement
    attributes:
      label: Spec requirement
      description: "The line in docs/spec.md it meets, such as R3. Not in the spec yet? It is an Idea first."
