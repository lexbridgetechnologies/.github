name: Goal
description: Something to reach by a date. Its work is its sub-issues
type: Goal
title: "Goal: "
projects: ["lexbridgetechnologies/2"]
body:
  - type: markdown
    attributes:
      value: "**No client data.** No client names, emails, documents or screenshots of client records, here or in comments."
  - type: markdown
    attributes:
      value: "Title: **Goal: what will be true**, e.g. *Goal: UAT covers every transaction, mostly automated*. No numbers: goals move earlier or later, so their order comes from their Start date and Target date, not from the title."
  - type: textarea
    id: outcome
    attributes:
      label: What will be true when it is done?
      description: "One or two sentences. Trace shows this as the summary."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: "What it is worth to the business, or to the people who use the app."
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: "One check per line. Someone else should be able to tick each one."
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Set **Start date** and **Target date** with the issue fields (the **+** at the bottom of this form, or the sidebar later); Trace reads them from there. After creating it, add the work with **Create sub-issue**."
