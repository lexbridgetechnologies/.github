name: Bug
description: Something that worked, or should work, and does not
type: Bug
projects: ["lexbridgetechnologies/2"]
body:
  - type: markdown
    attributes:
      value: "**No client data.** No client names, emails, documents or screenshots of client records, here or in comments."
  - type: markdown
    attributes:
      value: "Title: **what goes wrong**, e.g. *A new run overwrites revision 1*."
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: "One or two sentences. Trace shows this as the summary."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: did
    attributes:
      label: How to make it happen
      description: "The steps, in order, so someone else can do the same."
    validations:
      required: true
  - type: dropdown
    id: how-bad
    attributes:
      label: How bad is it?
      options:
        - "Stops work: nobody can get past it"
        - "Has a workaround: slower or awkward, but work goes on"
        - "Looks wrong: nothing is stopped"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - "Dev"
        - "Test"
        - "Prod"
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: When did it happen?
      description: "Day and time, e.g. Tue 3 Feb, about 10:40. It is what finds the error in the logs."
    validations:
      required: true
  - type: input
    id: correlation
    attributes:
      label: Correlation ID
      description: "From the error message, if it showed one."
